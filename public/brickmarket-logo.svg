<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 75" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .text-title { font-family: 'Inter', 'SF Pro Display', sans-serif; font-weight: 800; font-size: 40px; fill: #1a1a1a; }
      .lego-body { fill: #1a1a1a; /* rx removido para cantos retos */ }
      .lego-stud { fill: #ffffff; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Símbolo: Bloco LEGO 2x2 com cantos retos e altura exata do 'B' (~28px) -->
  <g transform="translate(10, 27)">
    <rect x="0" y="0" width="28" height="28" class="lego-body" />
    <circle cx="7" cy="7" r="3.5" class="lego-stud" />
    <circle cx="21" cy="7" r="3.5" class="lego-stud" />
    <circle cx="7" cy="21" r="3.5" class="lego-stud" />
    <circle cx="21" cy="21" r="3.5" class="lego-stud" />
  </g>

  <!-- Tipografia -->
  <text x="50" y="55" class="text-title">Brick<tspan style="font-weight: 300;">Market</tspan></text>
</svg>
